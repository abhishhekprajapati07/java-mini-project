# Test configuration: MySQL Mode in memory for rapid automated test execution
spring.datasource.url=jdbc:h2:mem:lifesaver_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

server.servlet.session.cookie.name=LIFESAVER_SESSION

app.cors.allowed-origins=http://localhost:5173
app.admin.default-username=admin
app.admin.default-password=AdminPassword@123
app.admin.default-email=admin@lifesaver.demo
app.admin.default-fullname=System Administrator
