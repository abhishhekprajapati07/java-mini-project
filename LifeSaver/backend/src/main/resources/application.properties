# ============================================================================
# LifeSaver - Spring Boot Application Configuration
# ============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Session Cookie Security for Admin Authentication
server.servlet.session.cookie.name=LIFESAVER_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# Database DataSource Configuration (JDBC with PreparedStatement - NO JPA/Hibernate)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifesaver_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Settings (Optimized for Monolith Mini Project)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=0

# CORS Configuration (Overridable via environment variable for deployment)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Initial Admin Bootstrap Configuration (Used only if admin_users table is empty)
app.admin.default-username=${DEFAULT_ADMIN_USER:admin}
app.admin.default-password=${DEFAULT_ADMIN_PASS:AdminPassword@123}
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@lifesaver.demo}
app.admin.default-fullname=${DEFAULT_ADMIN_NAME:System Administrator}

# Logging
logging.level.root=INFO
logging.level.com.lifesaver=DEBUG
